# GENERATED by scripts/sync-rust-driver.sh in the skaidb monorepo — do not edit.
# Mirror of skaidb 0.294.2: the driver crate (renamed `skaidb`) as the root
# package, plus the internal crates it depends on under crates/.

[package]
name = "skaidb"
version = "0.294.2"
edition = "2021"
license = "SSPL-1.0"
repository = "https://github.com/porcupin26/skaidb-rust"
rust-version = "1.93"
description = "Synchronous client for skaidb over the binary protocol: nearest-node selection, failover, pipelining, prepared statements, streamed results, TLS, SCRAM and Kerberos auth"
readme = "README.md"
homepage = "https://skaidb.org"
documentation = "https://skaidb.org/docs/"

[lints]
workspace = true

[features]
default = []
# Kerberos (SASL GSSAPI) client auth. Pulls in skaidb-gssapi -> cross-krb5,
# which links only on glibc/macOS/Windows — never the static-musl build.
kerberos = ["dep:skaidb-gssapi", "skaidb-gssapi/kerberos"]

[dependencies]
skaidb-types = { path = "crates/skaidb-types", version = "0.294.2" }
skaidb-proto = { path = "crates/skaidb-proto", version = "0.294.2" }
skaidb-auth = { path = "crates/skaidb-auth", version = "0.294.2" }
skaidb-net = { path = "crates/skaidb-net", version = "0.294.2" }
rustls.workspace = true
thiserror.workspace = true
# Optional: only compiled with the `kerberos` feature.
skaidb-gssapi = { path = "crates/skaidb-gssapi", version = "0.294.2", optional = true }

[workspace]
resolver = "2"
members = [
    "crates/skaidb-types",
    "crates/skaidb-proto",
    "crates/skaidb-auth",
    "crates/skaidb-net",
    "crates/skaidb-gssapi",
    "crates/skaidb-ffi",
]

[workspace.dependencies]
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
ring = "0.17"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
thiserror = "2"
webpki-roots = "0.26"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"
