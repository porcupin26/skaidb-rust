# GENERATED by scripts/sync-rust-driver.sh in the skaidb monorepo — do not edit.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: build + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The `kerberos` feature links MIT krb5 through cross-krb5.
      - name: Kerberos headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libkrb5-dev
      - name: Build (default features)
        run: cargo build --workspace --locked
      - name: Build (all features)
        run: cargo build --workspace --all-features --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --all-features --locked
      - name: Examples
        run: cargo build --examples --locked
